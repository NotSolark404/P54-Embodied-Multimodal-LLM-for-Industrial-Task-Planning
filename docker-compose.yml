x-common-env: &common_env
  UR5_STATE_FILE: /data/tray_state.json
  LLM_CACHE_PATH: /data/.llm_cache

x-app: &app
  env_file:
    - .env
    - .env.compose
  command: ["sleep", "infinity"]
  restart: unless-stopped
  depends_on:
    - ollama

services:
  ollama:
    image: ollama/ollama:latest
    container_name: p54_ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      default:
        aliases:
          - p54_ollama

  p54-sim:
    <<: *app
    profiles: ["sim"]
    image: p54-sim:latest
    container_name: p54_sim
    build: { context: ., target: sim }
    environment:
      <<: *common_env
      ROBOT_BACKEND: mock
    volumes:
      - p54_data:/data
      # - .:/app

  p54-robot:
    <<: *app
    profiles: ["robot"]
    image: p54-robot:latest
    container_name: p54_robot
    build: { context: ., target: robot }
    environment:
      <<: *common_env
      ROBOT_BACKEND: urscript
    volumes:
      - p54_data:/data
      # - .:/app

  p54-full:
    <<: *app
    profiles: ["full"]
    image: p54-full:latest
    container_name: p54_full
    build: { context: ., target: full }
    environment:
      <<: *common_env
      ROBOT_BACKEND: ${ROBOT_BACKEND:-mock}
    volumes:
      - p54_data:/data
      # - .:/app

volumes:
  ollama_models:
  p54_data:
